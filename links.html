<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invitation Links</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mukta:wght@400;500;600&display=swap">
<style>
:root { --wine: #4a1226; --wine-deep: #1e0810; --gold: #c4a468; --gold-ink: #7d5e22; --ivory: #f7f0e4; --ivory-2: #efe5d3; --ink: #2a1820; --soft: #6c5a5f; --line: rgba(125,94,34,.35); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ivory); color: var(--ink); font: 16px/1.55 'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px max(18px, env(safe-area-inset-left)) 64px; }
h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 2.2rem; color: var(--wine); margin: 0 0 4px; }
.lead { color: var(--soft); margin: 0 0 28px; }
label { display: block; font-weight: 600; font-size: .85rem; letter-spacing: .04em; margin: 20px 0 6px; color: var(--wine); }
.hint { font-weight: 400; color: var(--soft); letter-spacing: 0; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 0; padding: 10px 12px; }
textarea { min-height: 140px; resize: vertical; }
#msg { min-height: 96px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }
.row { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .row.two { grid-template-columns: 1fr 1fr; } }
.btn { display: inline-block; border: 1px solid var(--wine); background: var(--wine); color: var(--ivory); padding: 10px 20px; font: 600 .95rem/1.2 inherit; font-family: inherit; cursor: pointer; text-decoration: none; border-radius: 0; text-align: center; }
.btn.alt { background: transparent; color: var(--wine); }
.btn.wa { background: #1f6b46; border-color: #1f6b46; }
.btn.small { padding: 8px 14px; font-size: .85rem; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
ul { list-style: none; padding: 0; margin: 26px 0 0; border-top: 1px solid var(--line); }
li { display: grid; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
li b { font-size: 1.05rem; overflow-wrap: anywhere; }
li code { font-size: .78rem; color: var(--soft); word-break: break-all; }
li .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.count { margin-top: 26px; font-weight: 600; color: var(--gold-ink); }
.note { margin-top: 34px; padding: 14px 16px; background: var(--ivory-2); border-left: 3px solid var(--gold); font-size: .92rem; color: var(--soft); }
</style>
</head>
<body>
<main>
  <h1>Invitation links</h1>
  <p class="lead">Paste your guest names, get one personal link each, and send it on WhatsApp in a tap. Nothing leaves this page.</p>

  <label for="base">Your invitation website address</label>
  <input id="base" type="url" inputmode="url" placeholder="https://saili-jeevan-invite.vercel.app" autocomplete="off">

  <div class="row two">
    <div>
      <label for="lang">Open the invitation in</label>
      <select id="lang"><option value="mr">Marathi (guest can switch)</option><option value="en">English (guest can switch)</option></select>
    </div>
  </div>

  <label for="names">Guest names <span class="hint">one per line. Add a phone number after a comma to open that person's chat directly.</span></label>
  <textarea id="names" placeholder="Rahul Sharma, 9876543210&#10;Priya Patil&#10;पाटील कुटुंब&#10;Mama & Mami, 9123456780"></textarea>

  <label for="msg">WhatsApp message <span class="hint">{name} and {link} are filled in for each guest.</span></label>
  <textarea id="msg"></textarea>

  <div class="actions">
    <button class="btn" id="go" type="button">Make links</button>
    <button class="btn alt" id="copyall" type="button" hidden>Copy all (name + link)</button>
  </div>

  <p class="count" id="count" hidden></p>
  <ul id="out"></ul>

  <p class="note">Everyone can also use the plain link without a name. The invitation then greets them with "Family &amp; Friends".</p>
</main>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var DEFAULT_MSG = 'नमस्कार {name}! सायली आणि जीवन यांच्या विवाहाचे आपणास सप्रेम निमंत्रण. 🙏\nWith love, you are invited to the wedding of Saili & Jeevan.\n\n{link}';
  var KEY = 'invite-links-v1';
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  $('base').value = store.base || '';
  $('names').value = store.names || '';
  $('msg').value = store.msg || DEFAULT_MSG;
  if (store.lang) $('lang').value = store.lang;

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ base: $('base').value, names: $('names').value, msg: $('msg').value, lang: $('lang').value })); } catch (e) {} }
  ['base', 'names', 'msg', 'lang'].forEach(function (id) { $(id).addEventListener('input', save); });

  function phoneOf(s) { var d = (s || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d.length >= 11 ? d : ''; }
  var items = [];

  function copy(text, btn) {
    var old = btn.textContent;
    function ok() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = old; }, 1500); }
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(t); }
    try { navigator.clipboard.writeText(text).then(ok, fb); } catch (e) { fb(); }
  }

  $('go').addEventListener('click', function () {
    var base = $('base').value.trim().replace(/\/+$/, '');
    var out = $('out'); out.innerHTML = ''; items = [];
    if (!/^https?:\/\//i.test(base)) { $('count').hidden = false; $('count').textContent = 'Type your website address first, starting with https://'; return; }
    var lines = $('names').value.split('\n');
    lines.forEach(function (ln) {
      ln = ln.trim(); if (!ln) return;
      var i = ln.lastIndexOf(','), name = ln, phone = '';
      if (i > -1 && phoneOf(ln.slice(i + 1))) { name = ln.slice(0, i).trim(); phone = phoneOf(ln.slice(i + 1)); }
      name = name.replace(/\s+/g, ' ').slice(0, 60);
      var link = base + '/?to=' + encodeURIComponent(name) + ($('lang').value === 'en' ? '&lang=en' : '');
      var text = $('msg').value.replace(/\{name\}/g, name).replace(/\{link\}/g, link);
      items.push({ name: name, link: link, text: text, phone: phone });
    });
    items.forEach(function (it) {
      var li = document.createElement('li');
      var b = document.createElement('b'); b.textContent = it.name;
      var c = document.createElement('code'); c.textContent = it.link;
      var d = document.createElement('div'); d.className = 'btns';
      var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn alt small'; cp.textContent = 'Copy link';
      cp.addEventListener('click', function () { copy(it.link, cp); });
      var wa = document.createElement('a'); wa.className = 'btn wa small'; wa.target = '_blank'; wa.rel = 'noopener';
      wa.textContent = it.phone ? 'Send on WhatsApp' : 'Send on WhatsApp (pick contact)';
      wa.href = 'https://wa.me/' + it.phone + '?text=' + encodeURIComponent(it.text);
      d.appendChild(cp); d.appendChild(wa);
      li.appendChild(b); li.appendChild(c); li.appendChild(d); out.appendChild(li);
    });
    $('count').hidden = false;
    $('count').textContent = items.length ? items.length + (items.length === 1 ? ' link ready' : ' links ready') : 'Add at least one name.';
    $('copyall').hidden = !items.length;
    save();
  });
  $('copyall').addEventListener('click', function () {
    copy(items.map(function (it) { return it.name + '\t' + it.link; }).join('\n'), this);
  });
})();
</script>
</body>
</html>
